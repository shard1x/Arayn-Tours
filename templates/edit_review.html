<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование отзыва</title>
    <link rel="stylesheet" href="/static/css/reviews_style.css">
</head>
<body>
    <h2>Редактирование отзыва</h2>
    <form method="post" action="{{ url_for('edit_review', review_id=review_id) }}">
        <textarea name="text" required>{{ review[0] }}</textarea><br>
        <select name="rating" required>
            <option value="1" {% if review[1] == 1 %}selected{% endif %}>1 звезда</option>
            <option value="2" {% if review[1] == 2 %}selected{% endif %}>2 звезды</option>
            <option value="3" {% if review[1] == 3 %}selected{% endif %}>3 звезды</option>
            <option value="4" {% if review[1] == 4 %}selected{% endif %}>4 звезды</option>
            <option value="5" {% if review[1] == 5 %}selected{% endif %}>5 звезд</option>
        </select><br>
        <button type="submit">Сохранить изменения</button>
    </form>
</body>
</html>
