<!-- login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
      <!-- Подключение внешнего CSS -->
<link rel="stylesheet" href="/static/css/login-register_style.css" />
</head>
<body>

<!-- Логотип в левом верхнем -->
<a href="/" class="logo-link">
  <img src="static/images/main-logo.png" alt="Логотип" class="logo" />
</a>

    <h2>Вход</h2>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Имя пользователя"><br>
        <input type="password" name="password" placeholder="Пароль"><br>
        <button type="submit">Войти</button>
        <p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}


<!-- Футер -->
<div class="footer">
    © Aryan Tours. Все права защищены.
</div>

</body>
</html>
