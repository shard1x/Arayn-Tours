<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Авторизация</title>
</head>
<body>

<h1>Авторизация</h1>

<form id="loginForm" method="POST" action="{{ url_for('login') }}" novalidate>
    <label for="email">Почта</label>
    <input type="email" id="email" name="email" required autocomplete="email" />
    <div class="error" id="emailError"></div>

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" />
    <div class="error" id="passwordError"></div>

    <button type="submit">Войти</button>
</form>

<div class="switch-link">
    Нет аккаунта? <a href="register">Зарегистрируйтесь</a>
</div>

<!-- Блок с флеш-сообщениями -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul style="color: red; margin-top: 20px; list-style: none; padding: 0;">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<script>
    const form = document.getElementById('loginForm');

    const emailInput = form.email;
    const passwordInput = document.getElementById('password');

    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    function validateEmail(email) {
        if (!email.includes('@')) return false;
        // Можно оставить вашу проверку или улучшить
        return /^[a-zA-Z0-9@._\-]+$/.test(email);
    }

    form.addEventListener('submit', e => {
        let valid = true;

        // Проверка почты
        if (!emailInput.value.trim()) {
            emailError.textContent = "Пожалуйста, введите почту";
            valid = false;
        } else if (!validateEmail(emailInput.value.trim())) {
            emailError.textContent = "Почта должна содержать только латинские буквы, цифры, символы @, . _ - и не содержать русских букв";
            valid = false;
        } else {
            emailError.textContent = "";
        }

        // Проверка пароля
        const passVal = passwordInput.value;
        if (!passVal) {
            passwordError.textContent = "Пожалуйста, введите пароль";
            valid = false;
        } else if (passVal.length < 8) {
            passwordError.textContent = "Пароль должен быть не менее 8 символов";
            valid = false;
        } else if (!/^[A-Za-z0-9]+$/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать только латинские буквы и цифры";
            valid = false;
        } else if (!/[A-Za-z]/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать хотя бы одну латинскую букву";
            valid = false;
        } else if (!/\d/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать хотя бы одну цифру";
            valid = false;
        } else {
            passwordError.textContent = "";
        }

        if (!valid) {
            e.preventDefault();
        }
        // Можно убрать alert для реальной отправки
    });
</script>

<footer class="site-footer">
  © Aryan Tours. Все права защищены.
</footer>

</body>
</html>
