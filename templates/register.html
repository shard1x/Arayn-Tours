<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Регистрация</title>
</head>
<body>

<h1>Регистрация</h1>

<form id="registerForm" method="POST" action="{{ url_for('register') }}">
    <!-- Имя -->
    <label for="name">Имя</label>
    <input type="text" id="name" name="name" required autocomplete="name" />
    <div class="error" id="nameError"></div>

    <!-- Номер телефона с фиксированным префиксом +7 -->
    <label for="phone">Номер телефона</label>
    <div class="phone-container">
        <div class="phone-prefix">+7</div>
        <input type="tel" id="phone" name="phone" maxlength="10" required placeholder="ХХХ-ХХХ-ХХ-ХХ" autocomplete="tel" />
    </div>
    <div class="error" id="phoneError"></div>

    <!-- Почта -->
    <label for="email">Почта</label>
    <input type="email" id="email" name="email" required autocomplete="email" />
    <div class="error" id="emailError"></div>

    <!-- Пароль -->
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required autocomplete="new-password" />
    <div class="error" id="passwordError"></div>

    <button type="submit">Зарегистрироваться</button>

    <!-- Блок с отображением сообщений -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</form>

<div class="switch-link">
    Зарегистрированы? <a href="/login">Войдите в аккаунт</a>
</div>

<script>
    const form = document.getElementById('registerForm');

    const nameInput = form.name;
    const emailInput = form.email;
    const passwordInput = document.getElementById('password');
    const phoneInput = document.getElementById('phone');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const phoneError = document.getElementById('phoneError');

    function validateEmail(email) {
        // Более строгая проверка email (может быть расширена)
        const emailRegex = /^[a-zA-Z0-9._\-]+@[a-zA-Z0-9._\-]+\.[a-zA-Z]{2,}$/;
        return emailRegex.test(email);
    }

    function validateName(name) {
        // Разрешены только русские и латинские буквы, минимум 3 символа
        return /^[A-Za-zА-Яа-я]{3,}$/.test(name);
    }

    function validatePhone(phone) {
        // Только 10 цифр
        return /^\d{10}$/.test(phone);
    }

    form.addEventListener('submit', e => {
        let valid = true;

        // Проверка Имени
        if (!nameInput.value.trim()) {
            nameError.textContent = "Пожалуйста, введите имя";
            valid = false;
        } else if (!validateName(nameInput.value.trim())) {
            nameError.textContent = "Имя должно состоять минимум из 3 русских или латинских букв без других символов.";
            valid = false;
        } else {
            nameError.textContent = "";
        }

        // Проверка почты
        if (!emailInput.value.trim()) {
            emailError.textContent = "Пожалуйста, введите почту";
            valid = false;
        } else if (!validateEmail(emailInput.value.trim())) {
            emailError.textContent = "Пожалуйста, введите корректный адрес электронной почты";
            valid = false;
        } else {
            emailError.textContent = "";
        }

        // Проверка пароля
        const passVal = passwordInput.value;
        if (!passVal) {
            passwordError.textContent = "Пожалуйста, введите пароль";
            valid = false;
        } else if (passVal.length < 8) {
            passwordError.textContent = "Пароль должен быть не менее 8 символов";
            valid = false;
        } else if (!/^[A-Za-z0-9]+$/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать только латинские буквы и цифры";
            valid = false;
        } else if (!/[A-Za-z]/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать хотя бы одну латинскую букву";
            valid = false;
        } else if (!/\d/.test(passVal)) {
            passwordError.textContent = "Пароль должен содержать хотя бы одну цифру";
            valid = false;
        } else {
            passwordError.textContent = "";
        }

        // Проверка номера телефона
        const phoneVal = document.getElementById('phone').value.trim();
        if (!phoneVal) {
            phoneError.textContent = "Пожалуйста, введите 10 цифр после префикса +7";
            valid = false;
        } else if (!validatePhone(phoneVal)) {
            phoneError.textContent = "Введите корректные 10 цифр после префикса +7";
            valid = false;
        } else {
            phoneError.textContent = "";
        }

        if (!valid) {
            e.preventDefault();
        }
    });
</script>

<footer class="site-footer">
  © Aryan Tours. Все права защищены.
</footer>

</body>
</html>
